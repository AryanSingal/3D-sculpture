<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Glass Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Animated gradient background */
            background: linear-gradient(-45deg, #0f172a, #312e81, #1e1b4b, #020617, #4c1d95);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient floating orbs in the background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(56, 189, 248, 0.4); top: 10%; left: 20%; }
        .orb-2 { width: 400px; height: 400px; background: rgba(232, 121, 249, 0.4); bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-50px) scale(1.1); }
        }

        /* The Glass Container */
        .glass-calculator {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* Glass Screen Display */
        .glass-screen {
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-wrap: break-word;
            word-break: break-all;
        }

        /* Button Styling & Hover/Active States */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .glass-btn:hover::before {
            opacity: 1;
        }

        .glass-btn:active {
            transform: translateY(1px) scale(0.95);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Operator buttons styling */
        .operator-btn {
            background: rgba(236, 72, 153, 0.15); /* Pinkish tint */
            color: #fbcfe8;
            border-color: rgba(236, 72, 153, 0.3);
        }
        .operator-btn:hover {
            background: rgba(236, 72, 153, 0.3);
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4);
        }

        /* Action buttons (AC, DEL) styling */
        .action-btn {
            background: rgba(14, 165, 233, 0.15); /* Cyan tint */
            color: #bae6fd;
            border-color: rgba(14, 165, 233, 0.3);
        }
        .action-btn:hover {
            background: rgba(14, 165, 233, 0.3);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
        }

        /* Equals button styling */
        .equal-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6); /* Pink to Purple */
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
        }
        .equal-btn:hover {
            background: linear-gradient(135deg, #db2777, #7c3aed);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.7);
        }

        /* Custom Scrollbar for the display if it gets too long */
        .glass-screen::-webkit-scrollbar {
            width: 4px;
        }
        .glass-screen::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-white antialiased">

    <!-- Decorative Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main Calculator Container -->
    <div class="glass-calculator rounded-3xl p-6 w-full max-w-[360px] mx-4 sm:mx-auto">
        
        <!-- Display Area -->
        <div class="glass-screen rounded-2xl mb-6 p-5 flex flex-col items-end justify-between h-32 overflow-hidden text-right">
            <div id="previous-operand" class="text-gray-400 text-sm h-6 font-light tracking-wider w-full overflow-hidden whitespace-nowrap text-ellipsis"></div>
            <div id="current-operand" class="text-4xl font-semibold w-full overflow-hidden whitespace-nowrap text-ellipsis">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button class="glass-btn action-btn col-span-2 rounded-xl text-lg font-medium py-4" onclick="calculator.clear()">AC</button>
            <button class="glass-btn action-btn rounded-xl text-lg font-medium py-4" onclick="calculator.delete()">DEL</button>
            <button class="glass-btn operator-btn rounded-xl text-2xl font-medium py-4" onclick="calculator.chooseOperation('÷')">÷</button>
            
            <!-- Row 2 -->
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('7')">7</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('8')">8</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('9')">9</button>
            <button class="glass-btn operator-btn rounded-xl text-2xl font-medium py-4" onclick="calculator.chooseOperation('×')">×</button>
            
            <!-- Row 3 -->
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('4')">4</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('5')">5</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('6')">6</button>
            <button class="glass-btn operator-btn rounded-xl text-3xl font-medium py-4 leading-none" onclick="calculator.chooseOperation('-')">-</button>
            
            <!-- Row 4 -->
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('1')">1</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('2')">2</button>
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('3')">3</button>
            <button class="glass-btn operator-btn rounded-xl text-2xl font-medium py-4" onclick="calculator.chooseOperation('+')">+</button>
            
            <!-- Row 5 -->
            <button class="glass-btn rounded-xl text-2xl font-light py-4" onclick="calculator.appendNumber('0')">0</button>
            <button class="glass-btn rounded-xl text-2xl font-bold py-4" onclick="calculator.appendNumber('.')">.</button>
            <button class="glass-btn equal-btn col-span-2 rounded-xl text-3xl font-medium py-4" onclick="calculator.compute()">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                if (this.currentOperand === '0') return;
                if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                // If it's just '0' and we type a number (not dot), replace the 0.
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    // Prevent extremely long numbers that break the UI layout
                    if(this.currentOperand.length < 15) {
                        this.currentOperand = this.currentOperand.toString() + number.toString();
                    }
                }
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '0' && this.previousOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '0';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if(current === 0) {
                            computation = "Error"; // Avoid division by zero
                        } else {
                            computation = prev / current;
                        }
                        break;
                    default:
                        return;
                }
                
                // Handle floating point precision issues (e.g., 0.1 + 0.2)
                if (typeof computation === 'number') {
                     computation = Math.round(computation * 10000000000) / 10000000000;
                }
               
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            getDisplayNumber(number) {
                if (number === 'Error') return number;
                
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                
                if (isNaN(integerDigits)) {
                    integerDisplay = '0';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                this.currentOperandTextElement.innerText = this.getDisplayNumber(this.currentOperand);
                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = 
                        `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
                
                // Scale down text if it gets too long
                if(this.currentOperand.length > 10) {
                    this.currentOperandTextElement.style.fontSize = '1.875rem'; // smaller text
                } else {
                    this.currentOperandTextElement.style.fontSize = '2.25rem'; // text-4xl
                }
            }
        }

        const previousOperandTextElement = document.getElementById('previous-operand');
        const currentOperandTextElement = document.getElementById('current-operand');
        
        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

        // Add keyboard support
        document.addEventListener('keydown', e => {
            // Numbers
            if (/[0-9.]/.test(e.key)) {
                e.preventDefault();
                calculator.appendNumber(e.key);
            }
            // Operators
            if (e.key === '+' || e.key === '-') {
                e.preventDefault();
                calculator.chooseOperation(e.key);
            }
            if (e.key === '*' || e.key === 'x') {
                e.preventDefault();
                calculator.chooseOperation('×');
            }
            if (e.key === '/') {
                e.preventDefault();
                calculator.chooseOperation('÷');
            }
            // Equals/Enter
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute();
            }
            // Delete/Backspace
            if (e.key === 'Backspace') {
                e.preventDefault();
                calculator.delete();
            }
            // Escape (Clear All)
            if (e.key === 'Escape') {
                e.preventDefault();
                calculator.clear();
            }
        });
    </script>
</body>
</html>
